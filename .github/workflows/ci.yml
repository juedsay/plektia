# CI de Plektia (SPEC-platform, "CI"). Todos los jobs bloquean el merge.
# Las actions se fijan por SHA y las imágenes por digest; Renovate las actualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el token solo puede leer el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # renovate: datasource=docker depName=semgrep/semgrep
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3

jobs:
  quality:
    name: Tipos, lint, tests unitarios y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Activar pnpm (versión de packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  database:
    name: Base de datos (pgTAP y asesores)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Activar pnpm (versión de packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Levantar Supabase local (sin servicios que los tests no usan)
        run: pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,mailpit,supavisor
      - run: pnpm test:db
      - run: pnpm db:advisors

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Activar pnpm (versión de packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Guardar el reporte si fallan los E2E
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Seguridad (dependencias, secretos y SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: gitleaks revisa todos los commits, no solo el último.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Activar pnpm (versión de packageManager)
        run: corepack enable
      - name: Vulnerabilidades altas o críticas en dependencias
        run: pnpm audit:deps
      - name: Secretos en todo el historial (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner
      - name: Tests de las reglas propias de Semgrep
        run: docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test .semgrep/rules
      - name: Análisis estático (Semgrep, sin telemetría)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/typescript --config p/secrets
          --config .semgrep/rules --exclude .semgrep
          src e2e tests supabase astro.config.mjs
