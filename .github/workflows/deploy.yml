# Deploy de Plektia a Cloudflare Workers (SPEC-platform). Corre solo cuando la CI
# pasó sobre un push a `main`: lo que llega a producción es exactamente lo que se probó.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Un deploy a la vez y sin cancelar uno a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a Cloudflare Workers
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Los secretos de Cloudflare viven en este entorno: ningún otro job los ve.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El commit que validó la CI, no la punta de `main` en este momento.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Activar pnpm (versión de packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Primero la base: el código nuevo puede depender del esquema nuevo. Las
      # migraciones solo agregan (nunca se edita una ya aplicada), así que el
      # Worker anterior sigue funcionando mientras se publica el nuevo.
      - name: Migraciones en Supabase
        run: pnpm exec supabase db push --yes --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Publicar en Cloudflare
        # La publishable key es pública por diseño; vive en el entorno para no
        # atar el repo (y sus forks) a un proyecto de Supabase.
        run: pnpm deploy:worker --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E de cabeceras, login y caché contra producción
        run: pnpm exec playwright test tests/e2e/security-headers.spec.ts tests/e2e/login-navegador.spec.ts tests/e2e/cache.spec.ts
        env:
          E2E_BASE_URL: ${{ vars.PRODUCTION_URL }}
