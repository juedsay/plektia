rules:
  - id: plektia-no-set-html
    message: >-
      `set:html` inyecta HTML sin escapar (XSS). Usá `{valor}` o `set:text` (para JSON-LD, `set:html={jsonLd(...)}`).
      Ver SPEC-public-page, amenaza "XSS con título, bio o descripción".
    severity: ERROR
    languages: [generic]
    paths:
      include: ["*.astro"]
    # Excepciones:
    # - datos estructurados pasados por `jsonLd()` (src/ui/view/seo.ts), que escapa
    #   `<`, `>` y `&` y tiene tests contra el cierre de `</script>`;
    # - la hoja de un estilo, `THEME_INLINE_STYLES[...]` (src/ui/styles/themes/inline.ts):
    #   CSS fijo del build, sin nada que escriba el usuario (`set:text` rompería `>`).
    pattern-regex: 'set:html\s*=\s*\{(?!jsonLd\(|THEME_INLINE_STYLES\[)'
